<!DOCTYPE html>
<html lang="en-ca">
  <head>
    <meta charset="utf-8">
    <title>DayBreak Homepage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Sofia+Sans:ital,wght@0,1..1000;1,1..1000&display=swap" rel="stylesheet">

    <style>
      html {
        font-size: 16px;
      }

      body {
        font-family: "Sofia Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        font-size: 1.5em;
        color: #211E1F;
        width: 1440px;
        margin: 0;
        padding: 0;
      }

      h1 {
        font-family: "Audiowide", sans-serif;
        font-weight: 400;
        font-style: normal;
        font-size: 5.33em;
      }

      h2 {
        font-family: "Sofia Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 700;
        font-style: normal;
        font-size: 4em;
        color: #883BF4;
      }

      h3 {
        font-family: "Sofia Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        font-size: 2em;
        color: #883BF4;
      }

      nav {
        width: 1200px;
        margin-left: 120px;
        background-color: #211E1F;
      }

      ul {
        list-style-type: none;
        background-color: #211E1F;
        padding-top: 18px;
      }

      ul li {
        float: right;
      }

      ul li a {
        display: block;
        color: white;
        text-align: center;
        text-decoration: none;
        margin-left: 30px;
        padding: 10px 10px;
      }

      ul li a:hover {
        color: #883BF4;
        border: 2px solid #883BF4;
      }

      ul li a.active {
        color: #883BF4;
        border: 2px solid #883BF4;
      }

      .containernav {
        background-color: #211E1F;
        width: 100%;
        height: 85px;
        margin-top: 15px;
        margin-bottom: 15px;
      }

      .container1 {
        margin-left: 120px;
        margin-right: 120px;
        background-color: red;
        align-items: center;
      }

      .container2 {
        display: grid;
        grid-template-columns: 50% 50%;
        gap: 100px;
      }

      .grid-item {
        min-height: 150px;
        gap: 30px;
      }
    </style>
  </head>
  <body>
    <div class="containernav">
      <nav>
        <ul>
          <li><a href="https://www.w3schools.com/css/tryit.asp?filename=trycss_navbar_horizontal_float">HOME</a></li>
          <li><a href="story.html">STORY</a></li>
          <li><a href="https://www.w3schools.com/css/tryit.asp?filename=trycss_navbar_horizontal_flex">CAST</a></li>
          <li><a href="https://www.w3schools.com/css/tryit.asp?filename=trycss_navbar_horizontal_flex">ABOUT</a></li>
        </ul>
      </nav>
    </div>
    <div class="container1">
      <h1>Hello World Wide Web!</h1>
      <h2>THE WORLD</h2>
    </div>
  </body>
</html>
