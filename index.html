<!DOCTYPE html>
<html lang="en-ca">
  <head>
    <meta charset="utf-8">
    <title>DayBreak Homepage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Sofia+Sans:ital,wght@0,1..1000;1,1..1000&display=swap" rel="stylesheet">

    <style>
      html {
        font-size: 16px;
      }
      body {
        font-family: "Sofia Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        font-size: 1.5em;
        color: #211E1F;
      }
      h1 {
          font-family: "Audiowide", sans-serif;
          font-weight: 400;
          font-style: normal;
        font-size: 5.33em;
      }
      h2 {
        font-family: "Sofia Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: <weight>;
        font-style: normal;
        font-size: 4em;
        color: #883BF4;
      }
      h3 {
        font-family: "Sofia Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: <weight>;
        font-style: normal;
        font-size: 2em;
        color: #883BF4;
      }
      .container2 {
        display: grid;
        grid-template-columns: 50% 50%;
        gap: 100px;
      }
      .grid-item {
        min-height: 150px;
        gap: 30px;
      }
    </style>
  </head>
  <body>
    <h1>Hello World Wide Web!</h1>
    <h2>THE WORLD</h2>
  </body>
</html>
