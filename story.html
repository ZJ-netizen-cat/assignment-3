<!DOCTYPE html>
<html lang="en-ca">
  <head>
    <meta charset="utf-8">
    <title>DayBreak Homepage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Sofia+Sans:ital,wght@0,1..1000;1,1..1000&display=swap" rel="stylesheet">

    <style>
      html {
        font-size: 16px;
      }

      body {
        font-family: "Sofia Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        font-size: 1.5em;
        color: #211E1F;
        max-width: 1440px;
        padding: 0;
      }

      h1 {
        font-family: "Audiowide", sans-serif;
        font-weight: 400;
        font-style: normal;
        font-size: 5.33em;
        text-align: center;
      }

      h2 {
        font-family: "Sofia Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 700;
        font-style: normal;
        font-size: 4em;
        color: #883BF4;
      }

      h3 {
        font-family: "Sofia Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 700;
        font-style: normal;
        font-size: 2em;
        color: #883BF4;
      }

      nav {
        width: 1200px;
        margin-left: 120px;
        background-color: #211E1F;
      }

      ul {
        list-style-type: none;
        background-color: #211E1F;
        padding-top: 18px;
      }

      ul li {
        float: right;
        color: #FFFFFF;
      }

      ul li a {
        display: block;
        color: white;
        text-align: center;
        text-decoration: none;
        margin-left: 30px;
        padding: 10px 10px;
      }

      ul li a:hover {
        color: #883BF4;
        border: 3px solid #883BF4;
        font-weight: 600;
      }
      
      ul li a:hover:not(.active) {
  background-color: #111111;
}

      ul li a.active {
        color: #883BF4;
        border: 2px solid red;
        font-weight: 600;
      }
    </style>
  </head>
</html>
<body>
  <nav>
    <ul>
      <li><a href="home.html">home</a></li>
    </ul>
  </nav>
  <h1>story</h1>
</body>
